# Render deployment config
# Docs: https://render.com/docs/blueprint-spec
#
# Single source of truth for Render deployments.
# Backend runs from the /backend subfolder.
# build step: install deps + seed the DB (idempotent — safe on every deploy)

services:
  - type: web
    name: onestyle-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node seed.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_ENV
        value: production
      - key: LOG_COMPANY_ID
        value: "0000"
      - key: LOG_THREAD
        value: "node-http"
      - key: DATABASE_URL
        sync: false   # Set this manually in the Render dashboard → Environment → DATABASE_URL
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://sedigaplanit.github.io
